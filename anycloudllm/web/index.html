<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>any-company-llm</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1c1f26;
    --line: #2b3038;
    --text: #e6e8ec;
    --muted: #8b93a1;
    --accent: #6ea8fe;
    --user: #253044;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f7f8fa; --panel: #fff; --line: #e2e5ea;
      --text: #1b1e24; --muted: #6b7280; --accent: #2563eb; --user: #e8eefc;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.6 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: baseline; gap: 12px;
    padding: 12px 20px; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  header .meta { margin-left: auto; font-size: 12px; color: var(--muted); }
  header .dot { color: #3ddc84; }
  header .dot.bad { color: #ff6b6b; }
  #log { flex: 1; overflow-y: auto; padding: 24px 20px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  .msg { margin-bottom: 18px; }
  .role { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .bubble { white-space: pre-wrap; word-wrap: break-word; }
  .msg.user .bubble {
    background: var(--user); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 14px;
  }
  .empty { color: var(--muted); text-align: center; margin-top: 12vh; }
  .empty code { background: var(--panel); padding: 2px 6px; border-radius: 4px; }
  footer { border-top: 1px solid var(--line); padding: 14px 20px; }
  form { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px;
    font: inherit; max-height: 200px;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 10px;
    padding: 11px 20px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.stop { background: #d94f4f; }
  .hint { max-width: 760px; margin: 8px auto 0; font-size: 12px; color: var(--muted); }
  .err { color: #ff8080; }
  .cursor::after {
    content: "▌"; color: var(--accent);
    animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<header>
  <h1>any-company-llm</h1>
  <span class="meta" id="meta"><span class="dot" id="dot">●</span> <span id="metatext">connecting…</span></span>
</header>

<div id="log"><div class="wrap" id="wrap">
  <div class="empty" id="empty">
    Running entirely on this machine. No API key, no network calls.<br>
    Ask it something.
  </div>
</div></div>

<footer>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Send a message…  (Enter to send, Shift+Enter for newline)" autofocus></textarea>
    <button type="submit" id="send">Send</button>
  </form>
  <div class="hint" id="hint">First reply may take a while — the model runs on CPU.</div>
</footer>

<script>
const log = document.getElementById('log');
const wrap = document.getElementById('wrap');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');
const hint = document.getElementById('hint');
const empty = document.getElementById('empty');

// Full conversation, kept in memory only. Reloading the page clears it.
const history = [];
let controller = null;

fetch('/api/info').then(r => r.json()).then(info => {
  document.getElementById('metatext').textContent =
    `${info.file} · ${info.n_ctx} ctx · ${info.gpu ? 'GPU' : 'CPU'}`;
}).catch(() => {
  document.getElementById('dot').className = 'dot bad';
  document.getElementById('metatext').textContent = 'server unreachable';
});

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 200) + 'px';
});

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});

function addMessage(role, text) {
  empty.remove?.();
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.innerHTML = '<div class="role"></div><div class="bubble"></div>';
  el.querySelector('.role').textContent = role === 'user' ? 'You' : 'Model';
  el.querySelector('.bubble').textContent = text;
  wrap.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el.querySelector('.bubble');
}

function setBusy(busy) {
  input.disabled = busy;
  send.textContent = busy ? 'Stop' : 'Send';
  send.className = busy ? 'stop' : '';
  if (!busy) input.focus();
}

form.addEventListener('submit', async e => {
  e.preventDefault();

  if (controller) { controller.abort(); return; }  // button is "Stop" mid-stream

  const text = input.value.trim();
  if (!text) return;

  addMessage('user', text);
  history.push({ role: 'user', content: text });
  input.value = '';
  input.style.height = 'auto';

  const bubble = addMessage('assistant', '');
  bubble.classList.add('cursor');
  setBusy(true);
  hint.textContent = 'Generating…';

  controller = new AbortController();
  let reply = '';

  try {
    const res = await fetch('/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: 'local', messages: history, stream: true }),
      signal: controller.signal,
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${(await res.text()).slice(0, 300)}`);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    // Server-sent events: "data: {json}\n\n", terminated by "data: [DONE]".
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const parts = buffer.split('\n\n');
      buffer = parts.pop();
      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith('data:')) continue;
        const payload = line.slice(5).trim();
        if (payload === '[DONE]') continue;
        let chunk;
        try { chunk = JSON.parse(payload); } catch { continue; }
        const piece = chunk.choices?.[0]?.delta?.content;
        if (piece) {
          reply += piece;
          bubble.textContent = reply;
          log.scrollTop = log.scrollHeight;
        }
      }
    }
    history.push({ role: 'assistant', content: reply });
    hint.textContent = 'First reply may take a while — the model runs on CPU.';
  } catch (err) {
    if (err.name === 'AbortError') {
      // Keep whatever streamed so far so the context stays coherent.
      history.push({ role: 'assistant', content: reply });
      hint.textContent = 'Stopped.';
    } else {
      bubble.classList.add('err');
      bubble.textContent = reply + (reply ? '\n\n' : '') + '[error] ' + err.message;
      history.pop();  // drop the user turn that never got answered
      hint.textContent = 'Request failed.';
    }
  } finally {
    bubble.classList.remove('cursor');
    controller = null;
    setBusy(false);
  }
});
</script>
</body>
</html>
