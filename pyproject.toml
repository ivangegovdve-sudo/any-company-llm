[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anycloudllm"
version = "0.1.0"
description = "Scan hardware, download the right model, serve locally — OpenAI-compatible API, no cloud."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # [server] pulls fastapi/uvicorn/pydantic-settings — without it there is no
    # OpenAI-compatible app to serve.
    "llama-cpp-python[server]>=0.2.90",
    "huggingface-hub>=0.23.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
gpu = ["pynvml>=11.5.0"]
hermes = ["hermes-agents"]  # only if you want Hermes bridge
dev = ["pytest>=7.0"]

[project.scripts]
anycloudllm = "anycloudllm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["anycloudllm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
